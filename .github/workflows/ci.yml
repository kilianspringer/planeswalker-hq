name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Same pinned image as compose.dev.yml and the server.
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check . ../db
      - name: ruff format
        run: uv run ruff format --check . ../db
      - name: pytest
        # Every test creates a fresh database and runs all migrations from zero.
        run: uv run pytest -v

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  image:
    # The image is what gets deployed; a broken Dockerfile must fail here, not on the server.
    name: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t planeswalker:ci .
