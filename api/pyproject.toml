[project]
name = "planeswalker-api"
version = "0.1.0"
description = "API for Planeswalker HQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.150,<0.151",
    "psycopg[binary]>=3.3,<3.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.15",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# db/ holds the migration runner; tests import it as a plain module.
pythonpath = [".", "../db"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "../db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
