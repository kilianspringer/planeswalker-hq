# Local development on Ripley.
#
#   GIT_SHA=$(git rev-parse HEAD) docker compose -f compose.dev.yml up --build
#
# Then open http://localhost:8000. The database is also reachable on localhost:5433, which
# is where the API tests create their throwaway databases.
#
# The password below only protects a database bound to 127.0.0.1 on a developer machine.
# Real credentials never live in this repository.

name: planeswalker-dev

services:
  db:
    # Same pinned image as on the server — never "latest".
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planeswalker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql/18/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planeswalker"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: &build
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    command: ["python", "/app/db/migrate.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/planeswalker
    depends_on:
      db:
        condition: service_healthy

  app:
    build: *build
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/planeswalker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
